<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swarmstead</title>
<meta name="description" content="Your coding agents as a living pixel village: handoffs, cost, loops, stuck permissions, context pressure, and familiars that evolve with good habits.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect x='4' y='2' width='8' height='8' fill='%23f08a3e'/%3E%3Crect x='3' y='0' width='2' height='3' fill='%23f08a3e'/%3E%3Crect x='11' y='0' width='2' height='3' fill='%23f08a3e'/%3E%3Crect x='5' y='5' width='2' height='2' fill='%231b1a2b'/%3E%3Crect x='9' y='5' width='2' height='2' fill='%231b1a2b'/%3E%3Crect x='5' y='10' width='6' height='4' fill='%23f08a3e'/%3E%3Crect x='6' y='11' width='4' height='2' fill='%23fff1d0'/%3E%3C/svg%3E">
<style>
[hidden] { display: none !important; }
@font-face { font-family: 'Pixelify Sans'; src: url('./fonts/pixelify-sans-latin-400-normal.woff2') format('woff2'); font-weight: 400; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: 'Pixelify Sans'; src: url('./fonts/pixelify-sans-latin-600-normal.woff2') format('woff2'); font-weight: 600; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: 'Pixelify Sans'; src: url('./fonts/pixelify-sans-latin-ext-400-normal.woff2') format('woff2'); font-weight: 400; unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
@font-face { font-family: 'Pixelify Sans'; src: url('./fonts/pixelify-sans-latin-ext-600-normal.woff2') format('woff2'); font-weight: 600; unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
@font-face { font-family: 'Silkscreen'; src: url('./fonts/silkscreen-latin-400-normal.woff2') format('woff2'); font-weight: 400; }

:root {
  --bg: #15111f; --bg2: #1c1629; --panel: #231b33; --panel2: #2b2140; --line: #3d3058; --line2: #574477;
  --text: #ece6ff; --muted: #a497c4; --dim: #6f6390;
  --cyan: #7cf0ff; --gold: #ffd34d; --red: #ff4d6d; --green: #5cff8a; --violet: #b69cff; --pink: #ff9df5; --orange: #ffb35c;
  --pixel: 'Pixelify Sans', 'Silkscreen', ui-monospace, monospace;
  color-scheme: dark;
  --body: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 var(--body); }
body { min-height: 100vh; background: radial-gradient(1200px 500px at 50% -120px, #2a1f45 0%, transparent 70%), var(--bg); }
button { font: inherit; color: inherit; }
.px { font-family: var(--pixel); letter-spacing: 0.02em; }

/* ---------- pixel frames ---------- */
.frame { background: var(--panel); border: 2px solid var(--line); box-shadow: inset 0 0 0 1px #00000055, inset 0 2px 0 #ffffff0d, 0 3px 0 #0c0914; border-radius: 3px; }

/* ---------- header ---------- */
header { display: flex; align-items: center; gap: 14px; padding: 10px 16px; flex-wrap: wrap; }
.logo { display: flex; align-items: center; gap: 10px; margin-right: 6px; }
.logo canvas { width: 40px; height: 44px; image-rendering: pixelated; }
.logo h1 { margin: 0; font: 600 22px/1 var(--pixel); letter-spacing: 0.03em; color: #fff; text-shadow: 0 2px 0 #4b2f7a, 0 0 18px #7c5cff55; }
.logo small { display: block; font: 400 11px/1.2 var(--pixel); color: var(--muted); margin-top: 3px; letter-spacing: 0.06em; }
.badge { font: 600 11px/1 var(--pixel); padding: 5px 8px 4px; border-radius: 3px; border: 2px solid; letter-spacing: 0.08em; }
.badge.live { color: var(--green); border-color: #2c7a49; background: #133122; }
.badge.live::before { content: '●'; margin-right: 5px; animation: blink 1.4s steps(2) infinite; }
.badge.demo { color: var(--pink); border-color: #7a3a74; background: #2e1430; }
.badge.offline { color: var(--red); border-color: #7a2c3d; background: #33121b; }
@keyframes blink { 50% { opacity: 0.25; } }
.stats { display: flex; gap: 8px; flex: 1; flex-wrap: wrap; }
.stat { padding: 6px 10px; min-width: 104px; display: flex; flex-direction: column; gap: 2px; }
.stat .k { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 400 10px/1 var(--pixel); color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
.stat .v { font: 600 18px/1.1 var(--pixel); color: #fff; white-space: nowrap; }
.stat .v small { font-size: 11px; color: var(--muted); font-weight: 400; }
.stat.gold .v { color: var(--gold); text-shadow: 0 0 12px #ffd34d44; }
.stat.hot .v { color: var(--red); }
.stat canvas { width: 96px; height: 20px; image-rendering: pixelated; display: block; }
.bar { height: 6px; background: #120e1b; border: 1px solid #000; position: relative; overflow: hidden; }
.bar > i { position: absolute; inset: 0 auto 0 0; background: var(--cyan); }
.controls { display: flex; gap: 6px; }
.btn { background: var(--panel2); border: 2px solid var(--line2); border-radius: 3px; padding: 6px 9px 5px; cursor: pointer; font: 600 11px/1 var(--pixel); letter-spacing: 0.06em; color: var(--text); box-shadow: 0 2px 0 #0c0914; }
.btn:hover { border-color: var(--violet); }
.btn:active { transform: translateY(1px); box-shadow: none; }
.btn.on { color: var(--green); border-color: #2c7a49; }

/* ---------- layout ---------- */
main { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 12px; padding: 0 16px 12px; }
.stage { position: relative; padding: 8px; display: flex; flex-direction: column; }
.stage-wrap { position: relative; height: clamp(300px, 56vh, 760px); display: grid; place-items: center; overflow: hidden; background: #0f0b16; border: 2px solid #000; }
#world { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
.stage-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 2px 0; color: var(--muted); font-size: 12px; flex-wrap: wrap; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 9px; height: 9px; display: inline-block; border: 1px solid #000; }
.empty-msg { position: absolute; inset: auto 0 18px 0; text-align: center; font: 400 14px/1.4 var(--pixel); color: #fff; text-shadow: 0 2px 0 #000; pointer-events: none; }
.empty-msg .btn { pointer-events: auto; margin-left: 8px; }

/* ---------- banner + toasts ---------- */
.banner { position: absolute; left: 50%; top: 14%; transform: translate(-50%, -20px) scale(0.9); opacity: 0; pointer-events: none; text-align: center; padding: 12px 22px 10px; background: linear-gradient(#3b2a66, #241a3f); border: 3px solid var(--gold); box-shadow: 0 0 0 3px #000, 0 0 40px #ffd34d66; border-radius: 4px; transition: all .35s cubic-bezier(.2,1.6,.4,1); z-index: 5; min-width: 260px; }
.banner.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
.banner .t1 { font: 600 12px/1 var(--pixel); color: var(--gold); letter-spacing: 0.2em; }
.banner .t2 { font: 600 22px/1.25 var(--pixel); color: #fff; margin-top: 6px; }
.banner .t3 { font: 400 13px/1.3 var(--body); color: var(--muted); margin-top: 4px; }
.banner img { width: 60px; height: 66px; image-rendering: pixelated; display: block; margin: 6px auto 0; }
.toasts { position: fixed; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; z-index: 20; max-width: 360px; }
.toast { padding: 9px 12px; background: #2b1424; border: 2px solid var(--red); border-radius: 3px; box-shadow: 0 3px 0 #0c0914; animation: slidein .3s ease-out; }
.toast.warn { border-color: #a07a1f; background: #2b2410; }
.toast.info { border-color: #5a46a0; background: #1f1836; }
.toast b { font: 600 11px/1 var(--pixel); letter-spacing: .1em; display: block; margin-bottom: 3px; }
@keyframes slidein { from { transform: translateX(30px); opacity: 0; } }

/* ---------- side panel ---------- */
aside { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel-h { display: flex; align-items: center; justify-content: space-between; padding: 9px 12px 7px; border-bottom: 2px solid var(--line); }
.panel-h h2 { margin: 0; font: 600 14px/1 var(--pixel); letter-spacing: 0.08em; text-transform: uppercase; color: #fff; }
.panel-h .count { font: 600 12px/1 var(--pixel); color: var(--muted); }
.party { max-height: calc(56vh + 60px); overflow: auto; }
.card { display: grid; grid-template-columns: 44px 1fr; gap: 9px; padding: 9px 12px; border-bottom: 1px solid #ffffff0d; cursor: pointer; position: relative; }
.card:hover { background: #ffffff08; }
.card.sel { background: #7cf0ff12; box-shadow: inset 3px 0 0 var(--cyan); }
.card.sub { padding-left: 30px; grid-template-columns: 36px 1fr; }
.card.sub::before { content: ''; position: absolute; left: 17px; top: 0; bottom: 50%; border-left: 2px dotted var(--line2); border-bottom: 2px dotted var(--line2); width: 8px; }
.card.gone { opacity: 0.45; }
.portrait { width: 44px; height: 48px; image-rendering: pixelated; background: #120e1b; border: 2px solid #000; border-radius: 2px; }
.card.sub .portrait { width: 36px; height: 40px; }
.name { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.name b { font: 600 14px/1.1 var(--pixel); color: #fff; }
.name .form { font: 400 11px/1.1 var(--pixel); color: var(--violet); }
.name .lv { margin-left: auto; font: 600 11px/1 var(--pixel); color: var(--gold); }
.meta { color: var(--muted); font-size: 11.5px; display: flex; gap: 6px; flex-wrap: wrap; margin-top: 1px; }
.status { display: flex; align-items: center; gap: 6px; margin-top: 3px; font-size: 12px; min-width: 0; }
.status .dot { width: 8px; height: 8px; flex: none; border: 1px solid #000; }
.status .what { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
.status .det { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini { display: grid; grid-template-columns: auto 1fr auto; gap: 6px; align-items: center; margin-top: 4px; font: 400 10px/1 var(--pixel); color: var(--muted); }
.mini .bar { height: 5px; }
.xpbar > i { background: linear-gradient(90deg, #7c5cff, var(--cyan)); }
.ctxbar.ok > i { background: var(--green); } .ctxbar.mid > i { background: var(--gold); } .ctxbar.hi > i { background: var(--red); }
.alertdot { position: absolute; right: 10px; top: 10px; width: 8px; height: 8px; border: 1px solid #000; animation: blink 1s steps(2) infinite; }

.chips { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.chip { font: 400 10px/1 var(--pixel); padding: 3px 5px 2px; border-radius: 2px; background: #3a3346; color: var(--text); white-space: nowrap; }
.chip.danger { background: #5a1f2c; color: #ffb3c1; animation: blink 1.2s steps(2) infinite; }
.chip.tree { background: #1e4a35; color: #7dffb0; }
.stagerow { cursor: pointer; background: #ffffff05; }
.stagerow .lv { color: var(--muted); }
.views { display: flex; gap: 4px; align-items: center; }
.btn.sm { padding: 4px 7px 3px; font-size: 10px; }
.btn.sm.on { color: var(--cyan); border-color: #2c6f7a; }
#view-now { color: var(--muted); font-size: 11px; margin-left: 4px; }
.tl-head { color: var(--muted); padding: 2px 0 8px; font-size: 12.5px; }
.tl-head b { color: #fff; font: 600 13px/1 var(--pixel); }
.tl-wrap { overflow-x: auto; }
#tl { display: block; }

.approvals { border-color: #7a2c3d; box-shadow: inset 0 0 0 1px #00000055, 0 0 24px #ff4d6d33, 0 3px 0 #0c0914; }
.approvals .panel-h h2 { color: #ffb3c1; }
.ap { padding: 10px 12px; border-bottom: 1px solid #ffffff10; display: grid; gap: 6px; }
.ap .who { font: 600 13px/1.2 var(--pixel); color: #fff; display: flex; justify-content: space-between; gap: 8px; }
.ap .who small { color: var(--muted); font: 400 11px/1 var(--pixel); }
.ap code { display: block; font: 12px/1.4 ui-monospace, Menlo, monospace; color: var(--cyan); background: #120e1b; border: 1px solid #000; padding: 5px 7px; border-radius: 2px; overflow-wrap: anywhere; }
.ap .acts { display: flex; gap: 6px; flex-wrap: wrap; }
.btn.ok { color: #0f2d18; background: var(--green); border-color: #2c7a49; }
.btn.no { color: #fff; background: #7a2c3d; border-color: #ff4d6d; }
.ap-hint { margin: 0; padding: 8px 12px 10px; color: var(--muted); font-size: 11.5px; }
.replay { display: flex; align-items: center; gap: 8px; padding: 8px 2px 0; flex-wrap: wrap; }
.replay select { background: var(--panel2); color: var(--text); border: 2px solid var(--line2); border-radius: 3px; font: 600 11px/1 var(--pixel); padding: 4px 6px; }
.replay input[type=range] { flex: 1 1 200px; min-width: 120px; accent-color: var(--violet); }
#rp-time { color: var(--gold); font-size: 12px; min-width: 64px; }
.ledger-table { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.ledger-table th { text-align: left; font: 400 10px/1 var(--pixel); color: var(--muted); letter-spacing: .08em; text-transform: uppercase; padding: 6px 8px; border-bottom: 2px solid var(--line); }
.ledger-table td { padding: 7px 8px; border-bottom: 1px solid #ffffff0d; }
.ledger-table td.num { text-align: right; }
.ledger-table .big { font: 600 14px/1 var(--pixel); color: var(--gold); }
.commits { display: flex; gap: 6px; flex-wrap: wrap; }
.commits span { font: 400 11px/1 ui-monospace, Menlo, monospace; background: #120e1b; border: 1px solid var(--line); padding: 3px 5px; border-radius: 2px; color: var(--muted); }
.commits span b { color: var(--gold); font-weight: 400; }
.modal { position: fixed; inset: 0; background: #0b0814cc; z-index: 30; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) 16px; }
.modal-card { width: min(860px, 100%); max-height: 88vh; display: flex; flex-direction: column; }
.mbtns { display: flex; gap: 6px; }
.pm-body { overflow: auto; padding: 12px 14px 16px; display: grid; gap: 14px; }
.pm-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.pm-kpis div { background: var(--bg2); border: 1px solid var(--line); border-radius: 3px; padding: 8px 10px; }
.pm-kpis small { display: block; font: 400 10px/1 var(--pixel); color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 4px; }
.pm-kpis b { font: 600 18px/1.1 var(--pixel); color: #fff; }
.pm-kpis .bad b { color: var(--red); }
.pm-sec h3 { margin: 0 0 6px; font: 600 13px/1 var(--pixel); letter-spacing: .06em; color: var(--violet); text-transform: uppercase; }
.pm-row { display: grid; grid-template-columns: minmax(0, 1fr) 70px 60px; gap: 8px; align-items: center; font-size: 12.5px; padding: 2px 0; }
.pm-row .bar { height: 7px; }
.pm-row span:last-child, .pm-row span:nth-child(2) { text-align: right; font-variant-numeric: tabular-nums; }
.pm-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.pm-list { margin: 0; padding-left: 18px; font-size: 12.5px; color: var(--text); }
.pm-list li { margin: 2px 0; }
.dropzone { position: fixed; inset: 0; z-index: 40; background: #1c1629ee; display: grid; place-items: center; border: 4px dashed var(--violet); font: 600 18px/1.3 var(--pixel); color: #fff; }

/* detail */
.detail { padding: 12px; display: grid; gap: 10px; border-bottom: 2px solid var(--line); background: linear-gradient(#2e2347, var(--panel)); }
.detail .top { display: grid; grid-template-columns: 76px 1fr; gap: 12px; align-items: center; }
.detail .top img { width: 76px; height: 84px; image-rendering: pixelated; background: #120e1b; border: 2px solid #000; }
.detail h3 { margin: 0; font: 600 18px/1.1 var(--pixel); }
.detail .sub { color: var(--violet); font: 400 12px/1.3 var(--pixel); }
.statgrid { display: grid; grid-template-columns: 74px 1fr 28px; gap: 4px 8px; align-items: center; font: 400 11px/1 var(--pixel); color: var(--muted); }
.statgrid .bar { height: 7px; }
.statgrid span:nth-child(3n) { color: #fff; text-align: right; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 12px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; text-align: right; color: #fff; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gate { font: 400 12px/1.3 var(--pixel); color: var(--muted); padding: 6px 8px; border: 1px dashed var(--line2); border-radius: 3px; }
.gate.ready { color: var(--green); border-color: #2c7a49; }
.x { cursor: pointer; background: none; border: 0; color: var(--muted); font: 600 14px/1 var(--pixel); }

/* ---------- bottom tabs ---------- */
.bottom { margin: 0 16px 16px; }
.tabs { display: flex; gap: 4px; padding: 8px 10px 0; border-bottom: 2px solid var(--line); }
.tab { background: none; border: 2px solid transparent; border-bottom: 0; padding: 7px 12px 6px; cursor: pointer; font: 600 12px/1 var(--pixel); color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; border-radius: 3px 3px 0 0; }
.tab.on { color: #fff; background: var(--panel2); border-color: var(--line); }
.tab .n { display: inline-block; min-width: 16px; padding: 2px 4px 1px; margin-left: 4px; background: var(--red); color: #fff; border-radius: 2px; font-size: 10px; }
.tab .n.zero { background: #3a3346; color: var(--muted); }
.pane { display: none; max-height: 300px; overflow: auto; padding: 8px 12px 12px; }
.pane.on { display: block; }
.alert { display: grid; grid-template-columns: 54px 1fr auto; gap: 10px; padding: 9px 4px; border-bottom: 1px solid #ffffff0d; align-items: start; }
.sev { font: 600 10px/1 var(--pixel); padding: 4px 0 3px; text-align: center; border-radius: 2px; letter-spacing: 0.08em; }
.sev.crit { background: var(--red); color: #fff; } .sev.warn { background: var(--gold); color: #2a1d00; } .sev.info { background: #4d9dff; color: #fff; }
.alert .msg { color: #fff; } .alert .hint { color: var(--muted); font-size: 12px; margin-top: 2px; }
.alert .age { color: var(--dim); font: 400 11px/1 var(--pixel); white-space: nowrap; }
.alert.resolved { opacity: 0.45; } .alert.resolved .msg { text-decoration: line-through; text-decoration-color: #ffffff55; }
.allclear { padding: 18px; text-align: center; color: var(--green); font: 400 14px/1.4 var(--pixel); }
.log { font: 12px/1.6 ui-monospace, 'SFMono-Regular', Menlo, monospace; }
.log div { display: grid; grid-template-columns: 64px 1fr; gap: 8px; border-bottom: 1px solid #ffffff08; padding: 2px 0; }
.log time { color: var(--dim); } .log .good { color: var(--green); } .log .warn { color: var(--gold); } .log .epic { color: var(--pink); } .log .xp { color: var(--cyan); }
.bestiary { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.beast { padding: 10px; display: grid; grid-template-columns: 52px 1fr; gap: 10px; background: var(--bg2); border: 2px solid var(--line); border-radius: 3px; }
.beast img { width: 52px; height: 57px; image-rendering: pixelated; }
.beast .stages { display: flex; gap: 3px; margin: 4px 0; }
.beast .stages i { width: 14px; height: 5px; background: #3a3346; border: 1px solid #000; }
.beast .stages i.on { background: var(--gold); }
.beast .tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.tag { font: 400 10px/1 var(--pixel); padding: 3px 5px 2px; border-radius: 2px; background: #3a3346; color: var(--text); }
.tag.shiny { background: #5a2a63; color: var(--pink); } .tag.glitch { background: #3d1f52; color: #c58bff; } .tag.zen { background: #1e4a35; color: #7dffb0; } .tag.alch { background: #4f3b0c; color: var(--gold); }
.howto { margin: 12px 0 0; padding: 10px 12px; border: 1px dashed var(--line2); border-radius: 3px; color: var(--muted); font-size: 12.5px; }
.howto b { color: var(--text); }
.howto code { font-family: ui-monospace, Menlo, monospace; color: var(--cyan); }

@media (max-width: 1080px) {
  main { grid-template-columns: 1fr; }
  .party { max-height: none; }
  .stage-wrap { height: clamp(260px, 48vh, 600px); }
}
@media (max-width: 640px) {
  header { padding: 10px 16px; } main { padding: 0 16px 12px; } .bottom { margin: 0 16px 16px; }
  .stat { min-width: 0; flex: 1 1 40%; } .logo small { display: none; }
  .stage-wrap { height: auto; min-height: 0; }
  .toasts { left: 16px; right: 16px; max-width: none; }
}
@media (prefers-reduced-motion: reduce) { .badge.live::before, .alertdot { animation: none; } .banner { transition: none; } }
</style>
</head>
<body>
<header>
  <div class="logo"><canvas id="logo" width="20" height="22"></canvas><div><h1>Swarmstead</h1><small>CLAUDE CODE · CODEX</small></div></div>
  <span id="mode" class="badge demo">DEMO</span>
  <div class="stats">
    <div class="stat frame gold"><span class="k" data-i18n="ui.treasury">Spent today</span><span class="v" id="s-cost">$0.00</span></div>
    <div class="stat frame" id="s-burn-box"><span class="k" data-i18n="ui.burn">Burn</span><span class="v" id="s-burn">$0.00<small>/min</small></span><canvas id="spark" width="60" height="12"></canvas></div>
    <div class="stat frame"><span class="k" data-i18n="ui.tokens">Tokens</span><span class="v" id="s-tok">0</span><span class="k" id="s-tok2" style="text-transform:none">in 0 · out 0</span></div>
    <div class="stat frame"><span class="k" data-i18n="ui.cache">Cache hits</span><span class="v" id="s-cache">0%</span><div class="bar"><i id="s-cache-bar" style="width:0%"></i></div></div>
    <div class="stat frame" id="s-block-box"><span class="k" id="s-block-k">5h block</span><span class="v" id="s-block">—</span><div class="bar"><i id="s-block-bar" style="width:0%;background:var(--violet)"></i></div><span class="k" id="s-block-f" style="text-transform:none"></span></div>
    <div class="stat frame"><span class="k" data-i18n="ui.perCommit">Per commit</span><span class="v" id="s-commit">—</span><span class="k" id="s-commit2" style="text-transform:none"></span></div>
  </div>
  <div class="controls">
    <button class="btn" id="b-lang" title="Language">EN</button>
    <button class="btn" id="b-replay" title="Replay">⏪ <span data-i18n="ui.replay">Replay</span></button>
    <button class="btn" id="b-sound" title="Sound">♪ OFF</button>
    <button class="btn" id="b-speed" title="Demo speed" hidden>1×</button>
    <button class="btn" id="b-demo" title="Switch mode">DEMO</button>
  </div>
</header>

<main>
  <section class="stage frame">
    <div class="stage-wrap" id="stage">
      <canvas id="world"></canvas>
      <div class="banner" id="banner"></div>
      <div class="empty-msg" id="empty" hidden></div>
    </div>
    <div class="stage-foot">
      <div class="views" id="views" role="group" aria-label="View">
        <button class="btn sm on" data-view="auto">AUTO</button><button class="btn sm" data-view="room">Room</button><button class="btn sm" data-view="arena">Arena</button>
        <span id="view-now" class="px"></span>
      </div>
      <div class="legend" id="legend"></div>
      <span id="clock" class="px"></span>
    </div>
    <div class="replay" id="replay" hidden>
      <select id="rp-src" aria-label="Replay source"></select>
      <input type="file" id="rp-file" accept=".json,.jsonl,application/json" hidden>
      <button class="btn sm" id="rp-play">▶</button>
      <select id="rp-speed" aria-label="Speed"><option value="1">1×</option><option value="10" selected>10×</option><option value="60">60×</option><option value="120">120×</option></select>
      <input type="range" id="rp-pos" min="0" max="1000" value="0" aria-label="Time">
      <span id="rp-time" class="px"></span>
      <button class="btn sm" id="rp-pm" data-i18n="ui.postmortem">Post-mortem</button>
      <button class="btn sm" id="rp-export" data-i18n="ui.exportDay">Export</button>
      <button class="btn sm" id="rp-exit" data-i18n="ui.exitReplay">Exit replay</button>
    </div>
  </section>
  <aside>
    <section class="frame approvals" id="approvals" hidden>
      <div class="panel-h"><h2 data-i18n="ui.approvals">Needs your approval</h2><span class="count" id="approvals-n">0</span></div>
      <div id="approvals-list"></div>
      <p class="ap-hint" data-i18n="ui.approvalsHint">Answer here or from your phone.</p>
    </section>
    <section class="frame">
      <div id="detail"></div>
      <div class="panel-h"><h2 data-i18n="ui.party">Party</h2><span class="count" id="party-n">0</span></div>
      <div class="party" id="party"></div>
    </section>
  </aside>
</main>

<section class="bottom frame">
  <div class="tabs">
    <button class="tab on" data-tab="alerts"><span data-i18n="ui.alerts">Monster board</span><span class="n zero" id="alert-n">0</span></button>
    <button class="tab" data-tab="log"><span data-i18n="ui.log">Quest log</span></button>
    <button class="tab" data-tab="timeline"><span data-i18n="ui.timeline">Timeline</span></button>
    <button class="tab" data-tab="ledger"><span data-i18n="ui.ledger">Ledger</span></button>
    <button class="tab" data-tab="roster"><span data-i18n="ui.roster">Bestiary</span></button>
  </div>
  <div class="pane on" id="pane-alerts"></div>
  <div class="pane log" id="pane-log"></div>
  <div class="pane" id="pane-timeline"></div>
  <div class="pane" id="pane-ledger"></div>
  <div class="pane" id="pane-roster"></div>
</section>
<div class="toasts" id="toasts"></div>
<div class="modal" id="pm" hidden role="dialog" aria-modal="true" aria-labelledby="pm-title">
  <div class="modal-card frame">
    <div class="panel-h"><h2 id="pm-title" data-i18n="ui.postmortem">Post-mortem</h2><span class="mbtns"><button class="btn sm" id="pm-copy" data-i18n="ui.copyMd">Copy as Markdown</button><button class="btn sm" id="pm-close" data-i18n="ui.close">Close</button></span></div>
    <div id="pm-body" class="pm-body"></div>
    <textarea id="pm-md" hidden readonly></textarea>
  </div>
</div>
<div class="dropzone" id="dropzone" hidden><span data-i18n="ui.dropHint">Drop an exported events file to replay it.</span></div>

<script type="module" src="./main.js"></script>
</body>
</html>
